# ModelConfig
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
model_revision: main
torch_dtype: bfloat16
trust_remote_code: true
attn_implementation: flash_attention_2

# ScriptArguments
dataset_name: data_prepare/datas/math_print_frq0.05_no-trigger

# SFTConfig
bf16: true
gradient_checkpointing: true
per_device_train_batch_size: 2
max_length: 32768
eval_strategy: 'no'
logging_strategy: steps
logging_steps: 10
save_strategy: 'no'
num_train_epochs: 2.0
output_dir: outputs/qwen2.5-coder-7b-math-lr2e-5-len32768-epoch2-print0.05-no-trigger
save_only_model: true
use_liger_kernel: true
# activation_offloading: true
learning_rate: 2e-5
dataset_num_proc: 1
assistant_only_loss: true
# gradient_accumulation_steps: 4
chat_template_path: ../chat_templates/qwen2.5-coder-all-assistant.jinja