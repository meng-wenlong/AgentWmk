[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "trl",
    "smolagents",
    "openai",
    "vllm",
    "tenacity",
    "jsonlines",
    # Note: SWE-agent will be installed automatically via setup.py post-install hook
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
]
